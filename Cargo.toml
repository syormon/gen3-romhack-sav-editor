[package]
name = "gen3-romhack-sav-editor"
version = "0.1.3"
edition = "2024"
description = "Save editor for Pokémon ROM hacks; each game is a data pack under assets/"

[dependencies]
egui_extras = { version = "0.36", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# std::time::Instant and SystemTime panic in the browser; this is the same API
# on native and a working one on the web.
web-time = "1"

# The desktop builds draw with wgpu, eframe's default.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.36"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "web_screen_reader",
] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Url",
    "Window",
] }

# Windows only: the .exe gets its icon from a resource compiled into it, which
# is a build-time step rather than anything the egui API can do at runtime.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 2
