# Builds the desktop editor for Windows, Linux and macOS, and publishes them
# as a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag push builds all three and attaches them to a release named after the
# tag. Running it by hand from the Actions tab builds the same archives and
# keeps them as workflow artifacts without publishing anything — useful for
# checking a build before tagging it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # creating the release and uploading to it

env:
  CARGO_TERM_COLOR: always
  BIN: gen3-romhack-sav-editor

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Linux libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          # The oldest supported Ubuntu, so the binary's glibc requirement is as
          # low as it can be and it runs on more distributions.
          - os: ubuntu-22.04
            name: linux-x86_64
          # One universal app covering Apple Silicon and Intel, built on an
          # Apple Silicon runner.
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        name: Linux libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # ------------------------------------------------------------ Windows
      - if: runner.os == 'Windows'
        name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked
          $dir = "dist/$env:BIN"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/release/$env:BIN.exe" $dir
          Copy-Item -Recurse assets $dir
          Copy-Item README.md $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$env:BIN-${{ matrix.name }}.zip"

      # -------------------------------------------------------------- Linux
      - if: runner.os == 'Linux'
        name: Build and package
        run: |
          cargo build --release --locked
          dir="dist/$BIN"
          mkdir -p "$dir"
          cp "target/release/$BIN" "$dir/"
          cp -r assets README.md "$dir/"
          tar -czf "dist/$BIN-${{ matrix.name }}.tar.gz" -C dist "$BIN"

      # -------------------------------------------------------------- macOS
      - if: runner.os == 'macOS'
        name: Build a universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output "dist/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN"
          lipo -info "dist/$BIN"

      - if: runner.os == 'macOS'
        name: Bundle as a .app
        run: |
          APP="dist/Pokemon Save Editor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv "dist/$BIN" "$APP/Contents/MacOS/$BIN"

          # An .icns from the same PNG the other platforms use. It is 256px, so
          # stop at the sizes it can fill without upscaling.
          mkdir icon.iconset
          for size in 16 32 128 256; do
            sips -z $size $size assets/icon.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z $double $double assets/icon.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          # From Cargo.toml rather than the tag, so a manual run still gets a
          # valid bundle version.
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Pokémon Save Editor</string>
            <key>CFBundleDisplayName</key><string>Pokémon Save Editor</string>
            <key>CFBundleIdentifier</key><string>io.github.${{ github.repository_owner }}.${{ github.event.repository.name }}</string>
            <key>CFBundleExecutable</key><string>$BIN</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Apple Silicon refuses to run a binary with no signature at all, and
          # lipo invalidates the one the linker made. An ad-hoc signature is
          # enough to run; it is not notarisation, so Gatekeeper still asks
          # the first time (right-click -> Open).
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          # The assets folder goes next to the app rather than inside it: the
          # games are compiled in, and this copy is where users add their own.
          cp -r assets README.md dist/
          (cd dist && zip -qry "$BIN-${{ matrix.name }}.zip" "Pokemon Save Editor.app" assets README.md)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
