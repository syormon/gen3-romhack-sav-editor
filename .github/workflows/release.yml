name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write # creating the release and its tag
  pages: write # deploying the site
  id-token: write # proving to Pages that the deployment came from here

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: gen3-romhack-sav-editor

jobs:
  # Is this version new? A version is released once there is a v<version> tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      new: ${{ steps.check.outputs.new }}
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            new=false
          else
            new=true
          fi
          # Build when there is something to release, or when asked to.
          if [ "$new" = true ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            go=true
          else
            go=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml says $version; new release: $new; building: $go"

  test:
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Cargo.lock records this program's own version as well, so a version
      # bump pushed without a build leaves it behind, and --locked refuses to
      # run. Copy the version across, as Cargo would; the dependencies stay
      # pinned and checked by --locked.
      - name: Sync Cargo.lock with the version
        shell: bash
        run: |
          VERSION_NOW=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) \
            perl -0pi -e 's/(name = "\Q$ENV{BIN}\E"\r?\nversion = ")[^"]*/${1}$ENV{VERSION_NOW}/' Cargo.lock
          grep -A1 "^name = \"$BIN\"" Cargo.lock
      - run: rustup toolchain install stable --profile minimal
      - name: Linux libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  desktop:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          # The oldest supported Ubuntu, so the binary's glibc requirement is as
          # low as it can be and it runs on more distributions.
          - os: ubuntu-22.04
            name: linux-x86_64
          # One universal app covering Apple Silicon and Intel, built on an
          # Apple Silicon runner.
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: gen3-romhack-sav-editor-v${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      # Cargo.lock records this program's own version as well, so a version
      # bump pushed without a build leaves it behind, and --locked refuses to
      # run. Copy the version across, as Cargo would; the dependencies stay
      # pinned and checked by --locked.
      - name: Sync Cargo.lock with the version
        shell: bash
        run: |
          VERSION_NOW=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) \
            perl -0pi -e 's/(name = "\Q$ENV{BIN}\E"\r?\nversion = ")[^"]*/${1}$ENV{VERSION_NOW}/' Cargo.lock
          grep -A1 "^name = \"$BIN\"" Cargo.lock

      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        name: Linux libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Each release is just the program. The games and the icon are compiled
      # into it, so it needs nothing beside it; an assets/ folder placed next
      # to it is only read to override or add a game.

      # ------------------------------------------------------------ Windows
      - if: runner.os == 'Windows'
        name: Build
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/$env:BIN.exe" "dist/$env:ARCHIVE.exe"

      # -------------------------------------------------------------- Linux
      # In a tarball rather than bare: a file downloaded from a release loses
      # its executable bit, and tar keeps it.
      - if: runner.os == 'Linux'
        name: Build
        run: |
          cargo build --release --locked
          mkdir -p dist
          tar -czf "dist/$ARCHIVE.tar.gz" -C target/release "$BIN"

      # -------------------------------------------------------------- macOS
      - if: runner.os == 'macOS'
        name: Build a universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output "dist/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN"
          lipo -info "dist/$BIN"

      - if: runner.os == 'macOS'
        name: Bundle as a .app
        run: |
          APP="dist/Pokemon Save Editor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv "dist/$BIN" "$APP/Contents/MacOS/$BIN"

          # An .icns from the same 1024px PNG the other platforms use, at every
          # size macOS asks for.
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Pokémon Save Editor</string>
            <key>CFBundleDisplayName</key><string>Pokémon Save Editor</string>
            <key>CFBundleIdentifier</key><string>io.github.${{ github.repository_owner }}.${{ github.event.repository.name }}</string>
            <key>CFBundleExecutable</key><string>$BIN</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Apple Silicon refuses to run a binary with no signature at all, and
          # lipo invalidates the one the linker made. An ad-hoc signature is
          # enough to run; it is not notarisation, so Gatekeeper still asks
          # the first time (right-click -> Open).
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          # A .app is a folder, so it ships zipped. ditto keeps the signature
          # and the bundle's attributes intact, where plain zip may not.
          ditto -c -k --keepParent "$APP" "dist/$ARCHIVE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  web:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cargo.lock records this program's own version as well, so a version
      # bump pushed without a build leaves it behind, and --locked refuses to
      # run. Copy the version across, as Cargo would; the dependencies stay
      # pinned and checked by --locked.
      - name: Sync Cargo.lock with the version
        shell: bash
        run: |
          VERSION_NOW=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) \
            perl -0pi -e 's/(name = "\Q$ENV{BIN}\E"\r?\nversion = ")[^"]*/${1}$ENV{VERSION_NOW}/' Cargo.lock
          grep -A1 "^name = \"$BIN\"" Cargo.lock
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # Pages serves a project site from /<repository>/, not from the root,
      # so every URL Trunk writes into index.html needs that prefix.
      - name: Build
        run: trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
      # Named per attempt: a re-run is another attempt of the same run and
      # keeps the earlier attempt's artifact, and deploy-pages refuses to pick
      # between two artifacts of the same name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

  # Publish only once every platform has built, so a release is never missing
  # one and the site never runs ahead of the downloads.
  release:
    needs: [version, desktop, web]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  deploy:
    needs: [desktop, web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
