# Publishes the browser build to GitHub Pages on every push to main.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The site then lives at
#   https://<owner>.github.io/<repository>/

name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploying to Pages
  id-token: write # proving to Pages that the deployment came from this workflow

# One deployment at a time, and never cancel one half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Linux libraries for the native tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2

      # The engine is the same code in the browser; do not publish it broken.
      - run: cargo test --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # Pages serves a project site from /<repository>/, not from the root,
      # so every URL Trunk writes into index.html needs that prefix.
      - name: Build
        run: trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
